[project]
name = "ai-kids-factory"
version = "0.1.0"
description = "AI Kids Educational Animation Factory - autonomous educational video production pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "structlog>=24.4",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.7",
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
voice = [
    "kokoro>=0.9.4",
    "soundfile>=0.12",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
factory = "factory.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs running services (Postgres, models)",
    "live: calls a real external service (opt-in, uses subscription/API quota)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]  # autogenerated by Alembic

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# UP046: keep explicit TypeVar generics (shared T across Protocol methods reads clearer).
ignore = ["S101", "S603", "S607", "UP046"]

[tool.ruff.lint.per-file-ignores]
# Fake secrets are needed to test redaction; seeded RNG is fine in tests.
"tests/**" = ["S105", "S106", "S311"]

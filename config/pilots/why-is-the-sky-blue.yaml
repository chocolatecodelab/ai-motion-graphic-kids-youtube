schema_version: brief.v1
slug: why-is-the-sky-blue
title: Why Is the Sky Blue?
central_question: Why is the sky blue?
pillar: science_space
target_age_min: 8
target_age_max: 12
learning_objectives:
  - Sunlight looks white but is a mix of all the colours of the rainbow.
  - Tiny air molecules scatter short-wavelength blue light much more than red light.
  - At sunset light travels through more air, so even more blue is scattered away and reds and oranges reach our eyes.
storytelling_angle: >-
  Arka notices the sky outside the attic window and wonders why it is not purple or green.
  Lipa lights up the Discovery Compass to shrink them down so they can ride a sunbeam into the air
  and watch what happens to each colour when it bumps into air molecules.
twist: On Mars the daytime sky is orange-red, and sunsets there look blue-grey.
